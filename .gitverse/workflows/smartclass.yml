name: Autograding Tests
on: 
  push:
    branches:
      - master

jobs:
  run-autograding-tests:
    runs-on: hexlet-playwright
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run step1 tests
        run: npx playwright test --grep step1

      - name: Run step2 tests
        run: npx playwright test --grep step2

      - name: Run step3 tests
        run: npx playwright test --grep step3

      - name: Run step4 tests
        run: npx playwright test --grep step4

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
